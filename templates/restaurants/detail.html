{% extends 'base.html' %}
{% load restaurant_tags %}

{% block title %}{{ restaurant.name }} - flavor{% endblock %}

{% block content %}

<div class="detail-hero">
  {% if restaurant.photo %}
    <img src="{{ restaurant.photo.url }}" style="width:100%;height:380px;object-fit:cover;display:block;">
  {% else %}
    <div class="detail-hero-ph" style="font-size:80px; height:380px; display:flex; align-items:center; justify-content:center; background:#eee;">🍴</div>
  {% endif %}
</div>
